<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      min-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 24px;
      color: #667eea;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      color: #666;
    }

    .login-view, .dashboard-view {
      display: none;
    }

    .login-view.active, .dashboard-view.active {
      display: block;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    .input-group input:focus {
      outline: none;
      border-color: #667eea;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f5f5f5;
      color: #333;
      margin-top: 8px;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
      padding: 16px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-card .value {
      font-size: 28px;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 4px;
    }

    .stat-card .label {
      font-size: 12px;
      color: #666;
      font-weight: 600;
    }

    .user-info {
      background: #f9f9f9;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-info .email {
      font-size: 13px;
      color: #333;
      font-weight: 600;
    }

    .user-info .plan {
      font-size: 11px;
      color: #667eea;
      text-transform: uppercase;
      font-weight: 700;
    }

    .error {
      background: #fee;
      color: #c33;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .error.active {
      display: block;
    }

    .success {
      background: #efe;
      color: #3c3;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .success.active {
      display: block;
    }

    .loading {
      text-align: center;
      padding: 40px;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .link-btn {
      background: none;
      border: none;
      color: #667eea;
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
      margin-top: 12px;
      width: auto;
      display: block;
      text-align: center;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎯 Lead Gen Pro</h1>
      <p id="headerSubtitle">LinkedIn Lead Extractor</p>
    </div>

    <div id="errorMessage" class="error"></div>
    <div id="successMessage" class="success"></div>

    <!-- Login View -->
    <div id="loginView" class="login-view">
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="your@email.com">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••">
      </div>
      <button class="btn btn-primary" id="loginBtn">Sign In</button>
      <button class="link-btn" id="openDashboardBtn">Open Dashboard →</button>
    </div>

    <!-- Dashboard View -->
    <div id="dashboardView" class="dashboard-view">
      <div class="user-info">
        <div>
          <div class="email" id="userEmail">-</div>
          <div class="plan" id="userPlan">Free Plan</div>
        </div>
        <button class="btn btn-secondary" id="logoutBtn" style="width: auto; padding: 8px 16px; font-size: 12px;">Logout</button>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="value" id="totalLeads">0</div>
          <div class="label">Total Leads</div>
        </div>
        <div class="stat-card">
          <div class="value" id="todayLeads">0</div>
          <div class="label">Today</div>
        </div>
      </div>

      <button class="btn btn-primary" id="viewDashboardBtn">📊 View Full Dashboard</button>
      <button class="btn btn-secondary" id="exportBtn">📥 Export Leads</button>
    </div>

    <!-- Loading View -->
    <div id="loadingView" class="loading">
      <div class="spinner"></div>
      <p style="color: #666; font-size: 14px;">Loading...</p>
    </div>
  </div>

  <script src="popup-new.js"></script>
</body>
</html>
