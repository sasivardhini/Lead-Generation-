<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 350px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0a66c2 0%, #004182 100%);
    }

    .header {
      padding: 20px;
      color: white;
      text-align: center;
    }

    .header h1 {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .content {
      background: white;
      padding: 20px;
      border-radius: 12px 12px 0 0;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat {
      background: #f3f6f8;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-number {
      font-size: 24px;
      font-weight: bold;
      color: #0a66c2;
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
    }

    .leads {
      margin-top: 20px;
    }

    .leads h3 {
      font-size: 13px;
      color: #666;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .lead-item {
      background: #f3f6f8;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 8px;
      border-left: 3px solid #0a66c2;
    }

    .lead-name {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .lead-company {
      font-size: 12px;
      color: #666;
    }

    .lead-time {
      font-size: 10px;
      color: #999;
      margin-top: 4px;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #999;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #0a66c2;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    button:hover {
      background: #004182;
    }

    button.secondary {
      background: #f3f6f8;
      color: #333;
    }

    button.secondary:hover {
      background: #e8eef2;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎯 Lead Extractor</h1>
    <p>LinkedIn Profile Scraper</p>
  </div>

  <div class="content">
    <div class="stats">
      <div class="stat">
        <div class="stat-number" id="totalLeads">0</div>
        <div class="stat-label">Total Leads</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="todayLeads">0</div>
        <div class="stat-label">Today</div>
      </div>
    </div>

    <button onclick="exportCSV()">📊 Export to CSV</button>
    <button class="secondary" onclick="clearLeads()">🗑️ Clear All</button>

    <div class="leads">
      <h3>Recent Leads</h3>
      <div id="leadsList"></div>
    </div>
  </div>

  <script src="popup-new.js"></script>
</body>
</html>
